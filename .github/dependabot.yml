version: 2

updates:
  # GitHub Actions used across all workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Node dependencies for the Next.js site
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk minor/patch bumps into one PR to cut noise;
      # majors still open individually so breaking changes are reviewed.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ESLint 10 removed the deprecated rule-context API that
      # eslint-plugin-react still calls, and that plugin ships inside
      # eslint-config-next -- so `eslint .` crashes outright rather than
      # reporting anything. Stay on 9.x until eslint-config-next ships a
      # compatible eslint-plugin-react, then lift this deliberately.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  # Website Docker image
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(docker)"
    ignore:
      # Node majors alternate LTS/non-LTS and Dependabot only tracks the
      # newest tag, so it will happily move us onto an odd-numbered release
      # that is already past end-of-life. Stay on the LTS line and let a
      # human do the major bump deliberately; patch/minor still flow through.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
